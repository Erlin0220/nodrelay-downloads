name: Verify preview.33 native downloads
on:
  push:
    branches: ['codex/verify-preview.33']
permissions: {}
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            asset: devspace-fleet-0.1.5-preview.33-windows-x64.zip
            digest: 232cad8d411506f7cda346b9a95061484e7861b77388f65c4c4aa07e8517b025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check public archive and native runtime
        timeout-minutes: 5
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
          DIGEST: ${{ matrix.digest }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $url = "https://github.com/Erlin0220/nodrelay-downloads/releases/download/v0.1.5-preview.33-devices/$env:ASSET"
          curl --fail --silent --show-error --location --output $env:ASSET $url
          if ((Get-FileHash -Algorithm SHA256 $env:ASSET).Hash -ne $env:DIGEST) { throw 'Archive checksum mismatch' }
          mkdir payload
          tar -xf $env:ASSET -C payload
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $node = (Resolve-Path "payload/bin/node$suffix").Path
          & "payload/bin/cloudflared$suffix" --version
          & $node --check payload/fleet/src/device-runner.mjs
          cd payload/personal
          @'
          const assert = require('node:assert/strict');
          const db = new (require('better-sqlite3'))(':memory:');
          assert.equal(db.prepare('select 42 as n').get().n,42);
          db.close();
          const win = process.platform === 'win32';
          const pty = require('node-pty').spawn(win ? 'cmd.exe' : '/bin/echo',win ? ['/d','/c','echo NODRELAY_PTY_OK'] : ['NODRELAY_PTY_OK']);
          let output = '';
          pty.onData(data => output += data);
          pty.onExit(({exitCode}) => { if(win) pty.kill(); assert.equal(exitCode,0); assert.match(output,/NODRELAY_PTY_OK/); console.log('Native terminal and SQLite OK'); });
          '@ | & $node -
          if ($IsLinux) { & ./node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude --version }
